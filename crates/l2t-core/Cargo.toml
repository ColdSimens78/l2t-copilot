[package]
name = "l2t-core"
version = "0.1.0"
edition = "2024"

[dependencies]
midly = "0.5.3"
rmcp = { version = "3.11.0", features = ["client", "transport-child-process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }

[dev-dependencies]
tempfile = "3.27.0"
