[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "l2t-copilot"
version = "0.1.0"
description = "Loop-to-Track Copilot: open MCP tools that turn a found audio loop into an editable, DAW-ready track (analysis in Rust, generation in Python, DAW control via MCP)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ColdSimens" }]
requires-python = ">=3.10"
keywords = ["mcp", "music", "midi", "daw", "ai-agent", "soundcraft", "ableton"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mido>=1.3.2",
  "mcp>=1.2,<3",
  # mcp 2.x тянет форк httpx2 — прямой импорт httpx нужен явно
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
l2t-midi-gen = "mcp_servers.midi_gen.server:main"
l2t-qwen-brain = "mcp_servers.qwen_bridge.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/mcp_servers"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE"]
